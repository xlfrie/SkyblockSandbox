name: SBSandbox
version: '${project.version}'
main: sbsandbox.sbsandbox.SBSandbox
api-version: 1.19
authors: [ XLFrie ]
description: Skyblock sandbox scuffed edition.
depend: [ProtocolLib]
commands:
  loop:
    description: Loops a specific command
    usage: /loop times command
    permission: sbsandbox.sbandbox.admin
    permission-message: You do not have permission.
  spawn:
    description: Spawns custom mob.
    usage: /spawn id coordinates
    permission: sbsandbox.sbandbox.admin
    permission-message: You do not have permission.
  npc:
    description: Spawns npc.
    usage: /npc
    permission: OP
    permission-message: You do not have permission.
  stonk:
    description: Stonk.
    usage: /stonk
    permission: sbsandbox.admin
    permission-message: You do not have permission.
  reset:
    description: Reset.
    usage: /reset
    permission: sbsandbox.admin
    permission-message: You do not have permission.
  warp:
    description: Warp.
    usage: /reset
  lobby:
    description: Go to lobby.
    usage: /lobby
    aliases: l
  rank:
    description: Rank.
    usage: /rank rank